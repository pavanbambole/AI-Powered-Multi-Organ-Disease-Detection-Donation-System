<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kidneyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="vesselRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glowKidney" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Left Kidney -->
  <path d="M36 28 C22 28, 16 42, 16 56 C16 70, 24 82, 34 82 C42 82, 45 74, 43 64 C41 54, 45 44, 43 36 C41 30, 39 28, 36 28 Z" fill="url(#kidneyBlue)" filter="url(#glowKidney)"/>
  <!-- Right Kidney -->
  <path d="M64 28 C78 28, 84 42, 84 56 C84 70, 76 82, 66 82 C58 82, 55 74, 57 64 C59 54, 55 44, 57 36 C59 30, 61 28, 64 28 Z" fill="url(#kidneyBlue)" filter="url(#glowKidney)"/>
  <!-- Central vessels -->
  <path d="M48 20 L48 85" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M52 20 L52 85" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 50 C44 50, 38 52, 36 54" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M52 52 C56 52, 62 54, 64 56" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ureters -->
  <path d="M37 68 C38 78, 46 88, 48 95" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  <path d="M63 68 C62 78, 54 88, 52 95" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>

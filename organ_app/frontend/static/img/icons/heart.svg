<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="heartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="aortaArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glowHeart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Superior Vena Cava -->
  <path d="M36 14 L36 30" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
  <!-- Aorta Arch & Branches -->
  <path d="M48 28 C48 16, 62 14, 66 25 L66 35" stroke="url(#aortaArch)" stroke-width="8" stroke-linecap="round"/>
  <path d="M52 16 L52 10" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 14 L60 8" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 16 L68 11" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Pulmonary Artery -->
  <path d="M44 32 C48 30, 68 32, 74 38" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <!-- Main Cardiac Muscle / Ventricles -->
  <path d="M35 34 C25 38, 20 50, 24 64 C28 78, 46 90, 54 94 C57 95, 60 94, 62 90 C72 76, 84 62, 82 46 C80 34, 68 32, 58 35 C52 37, 44 36, 35 34 Z" fill="url(#heartRed)" filter="url(#glowHeart)"/>
  <!-- Coronary vessels / highlight lines -->
  <path d="M54 38 Q52 56 46 72 Q44 82 48 88" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M50 54 Q40 60 34 68" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M52 64 Q60 70 66 74" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
</svg>

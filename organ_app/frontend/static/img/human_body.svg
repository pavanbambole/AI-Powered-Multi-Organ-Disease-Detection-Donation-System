<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" fill="none">
  <defs>
    <!-- Background aura / glow gradients -->
    <radialGradient id="cyberAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="glowingRings" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Concentric Orbital Scanner Circles -->
  <circle cx="250" cy="270" r="210" stroke="url(#glowingRings)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="250" cy="270" r="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <circle cx="250" cy="270" r="250" stroke="#0ea5e9" stroke-width="0.8" opacity="0.2"/>

  <!-- Scanning Aura -->
  <ellipse cx="250" cy="290" rx="190" ry="240" fill="url(#cyberAura)"/>

  <!-- Torso & Head Holographic Mesh -->
  <!-- Head & Neck -->
  <ellipse cx="250" cy="72" rx="38" ry="46" stroke="#38bdf8" stroke-width="2" fill="#0284c7" fill-opacity="0.12"/>
  <path d="M236 114 L232 145 M264 114 L268 145" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Shoulders and Arms Silhouette -->
  <path d="M232 145 C190 152, 140 180, 110 225 C85 265, 75 340, 68 460
           C78 465, 100 440, 115 370 C125 320, 142 270, 158 240
           L162 480 C185 490, 220 495, 250 495 C280 495, 315 490, 338 480
           L342 240 C358 270, 375 320, 385 370 C400 440, 422 465, 432 460
           C425 340, 415 265, 390 225 C360 180, 310 152, 268 145 Z"
        fill="url(#bodyMesh)" stroke="#38bdf8" stroke-width="1.8" filter="url(#softGlow)"/>

  <!-- Rib Cage & Anatomical Lines -->
  <path d="M250 145 L250 450" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Ribs lines -->
  <path d="M245 185 Q205 190 175 220 M255 185 Q295 190 325 220" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <path d="M245 215 Q195 225 170 260 M255 215 Q305 225 330 260" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <path d="M245 245 Q195 260 175 300 M255 245 Q305 260 325 300" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  <path d="M245 275 Q205 295 185 340 M255 275 Q295 295 315 340" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>

  <!-- GLOWING ORGAN 1: HEART (Chest Left) -->
  <g transform="translate(252, 195) scale(0.65)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="38" fill="#ef4444" fill-opacity="0.4"/>
    <path d="M12 2 C3 5, 0 16, 4 28 C8 40, 24 50, 30 54 C36 50, 52 40, 56 28 C60 16, 48 4, 38 6 C32 8, 26 8, 20 4 Z" fill="#ef4444"/>
    <circle cx="28" cy="24" r="5" fill="#fee2e2"/>
  </g>

  <!-- GLOWING ORGAN 2: LIVER (Right Abdomen) -->
  <g transform="translate(160, 265) scale(0.68)" filter="url(#softGlow)">
    <circle cx="45" cy="30" r="45" fill="#f59e0b" fill-opacity="0.35"/>
    <path d="M15 28 C18 16, 38 10, 64 10 C82 10, 88 18, 88 30 C88 44, 76 60, 58 64 C42 68, 18 62, 12 50 C9 44, 12 36, 15 28 Z" fill="#d97706"/>
    <circle cx="48" cy="32" r="4" fill="#fef3c7"/>
  </g>

  <!-- GLOWING ORGAN 3: KIDNEYS (Lower Abdomen Bilateral) -->
  <g transform="translate(198, 335) scale(0.55)" filter="url(#softGlow)">
    <circle cx="48" cy="40" r="46" fill="#0284c7" fill-opacity="0.4"/>
    <!-- Left Kidney -->
    <path d="M22 20 C12 20, 8 32, 8 44 C8 56, 15 66, 24 66 C32 66, 34 58, 32 50 C30 42, 34 32, 32 26 C30 22, 26 20, 22 20 Z" fill="#38bdf8"/>
    <!-- Right Kidney -->
    <path d="M74 20 C84 20, 88 32, 88 44 C88 56, 81 66, 72 66 C64 66, 62 58, 64 50 C66 42, 62 32, 64 26 C66 22, 70 20, 74 20 Z" fill="#38bdf8"/>
  </g>

  <!-- Pulsing Data Nodes & Target Crosshairs -->
  <!-- Kidney callout crosshair -->
  <circle cx="210" cy="355" r="4" fill="#38bdf8"/>
  <line x1="210" y1="355" x2="140" y2="385" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Liver callout crosshair -->
  <circle cx="195" cy="285" r="4" fill="#f59e0b"/>
  <line x1="195" y1="285" x2="130" y2="285" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Heart callout crosshair -->
  <circle cx="272" cy="218" r="4" fill="#ef4444"/>
  <line x1="272" y1="218" x2="350" y2="218" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>

{% extends 'base.html' %}

{% block title %}Login | MultiOrganAI{% endblock %}

{% block content %}
<section class="section" style="min-height: 75vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 480px;">
    <div class="promo-card" style="box-shadow: var(--shadow-xl); padding: 40px;">
      <div style="text-align: center; margin-bottom: 28px;">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="MultiOrganAI" style="height: 48px; margin-bottom: 12px;">
        <h2 style="font-size: 26px; font-weight: 800;">Welcome Back</h2>
        <p style="font-size: 14px; color: var(--text-muted);">Access your multi-organ diagnostics and patient dashboard</p>
      </div>

      <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" name="identifier" class="form-input" placeholder="Enter username or email" required>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" id="toggleLoginPasswordBtn" aria-label="Toggle password visibility" title="Show password" onclick="togglePasswordVisibility('password', this)">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 20px;">
          Log In
        </button>

        <div style="text-align: center; font-size: 13.5px; color: var(--text-muted);">
          Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); font-weight: 600;">Sign up here</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
